apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
  labels:
    app: ui-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui-service
  template:
    metadata:
      labels:
        app: ui-service
    spec:
      containers:
      - name: ui-service
        image: sumeet02/django-retail-ui:latest
        ports:
        - containerPort: 8080
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: django-secret-key
        - name: DJANGO_DEBUG
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: django-debug
        - name: DJANGO_ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: django-allowed-hosts
        - name: CATALOG_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: catalog-service-url
        - name: CART_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: cart-service-url
        - name: ORDERS_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: orders-service-url
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
  labels:
    app: ui-service
spec:
  selector:
    app: ui-service
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  type: LoadBalancer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-config
data:
  django-debug: "False"
  django-allowed-hosts: "ui-service,localhost,127.0.0.1"
  catalog-service-url: "http://catalog-service:8001"
  cart-service-url: "http://cart-service:8002"
  orders-service-url: "http://orders-service:8003"
---
apiVersion: v1
kind: Secret
metadata:
  name: ui-secrets
type: Opaque
data:
  django-secret-key: eW91ci12ZXJ5LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24tbWluLTUwLWNoYXJz
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ui-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ui-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70