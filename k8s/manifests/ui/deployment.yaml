apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
  namespace: ecommerce
  labels:
    app: ui-service
spec:
  # replicas intentionally omitted — managed by HPA (minReplicas: 2, maxReplicas: 8)
  selector:
    matchLabels:
      app: ui-service
  template:
    metadata:
      labels:
        app: ui-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: ui-service
        image: sumeet02/django-retail-ui:latest
        # TODO: Pin to an immutable tag (e.g. :1.2.3 or a git SHA) before production
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: django-secret-key
        - name: DJANGO_DEBUG
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: django-debug
        - name: DJANGO_ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: django-allowed-hosts
        - name: CATALOG_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: catalog-service-url
        - name: CART_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: cart-service-url
        - name: ORDERS_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: orders-service-url
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: port
        - name: GUNICORN_WORKERS
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: gunicorn-workers
        - name: GUNICORN_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: gunicorn-timeout
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ui-config
              key: log-level
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
