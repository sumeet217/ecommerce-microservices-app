apiVersion: v1
kind: Service
metadata:
  name: ui-service
  namespace: ecommerce
  labels:
    app: ui-service
spec:
  selector:
    app: ui-service
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  # Changed from LoadBalancer to ClusterIP — external traffic is routed via the Ingress resource (ingress.yaml)
  type: ClusterIP
