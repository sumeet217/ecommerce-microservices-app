apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui-ingress
  namespace: ecommerce
  annotations:
    # Using nginx-ingress controller — change to your installed Ingress controller if different
    # e.g. "traefik.io/router.entrypoints: web,websecure" for Traefik
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Uncomment the following to enable TLS via cert-manager (recommended for production)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # Uncomment and configure TLS for production
  # tls:
  # - hosts:
  #   - your-domain.com
  #   secretName: ui-tls-cert
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ui-service
            port:
              number: 8080
