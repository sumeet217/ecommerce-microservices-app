apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-service-netpol
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app: ui-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from the Ingress controller only
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow egress to backend services
  - to:
    - podSelector:
        matchLabels:
          app: catalog-service
    ports:
    - protocol: TCP
      port: 8001
  - to:
    - podSelector:
        matchLabels:
          app: cart-service
    ports:
    - protocol: TCP
      port: 8002
  - to:
    - podSelector:
        matchLabels:
          app: orders-service
    ports:
    - protocol: TCP
      port: 8003
  # Allow DNS resolution
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
