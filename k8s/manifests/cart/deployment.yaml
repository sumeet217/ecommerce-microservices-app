apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  labels:
    app: cart-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
      - name: cart-service
        image: sumeet02/django-retail-cart:latest
        ports:
        - containerPort: 8002
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: cart-secrets
              key: django-secret-key
        - name: DJANGO_DEBUG
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: django-debug
        - name: DJANGO_ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: django-allowed-hosts
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: redis-url
        - name: CART_TTL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: cart-ttl-seconds
        - name: CART_MAX_ITEMS
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: cart-max-items
        - name: CART_MAX_QUANTITY_PER_ITEM
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: cart-max-quantity-per-item
        - name: CATALOG_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: catalog-service-url
        - name: CATALOG_SERVICE_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: catalog-service-timeout
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: port
        - name: GUNICORN_WORKERS
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: gunicorn-workers
        - name: GUNICORN_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: gunicorn-timeout
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: log-level
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: cors-allowed-origins
        - name: CORS_ALLOW_ALL_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: cart-config
              key: cors-allow-all-origins
        livenessProbe:
          httpGet:
            path: /health/
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"