apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-service-netpol
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app: catalog-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from ui-service and cart-service only
  - from:
    - podSelector:
        matchLabels:
          app: ui-service
    - podSelector:
        matchLabels:
          app: cart-service
    ports:
    - protocol: TCP
      port: 8001
  egress:
  # Allow egress to catalog database
  - to:
    - podSelector:
        matchLabels:
          app: catalog-db
    ports:
    - protocol: TCP
      port: 5432
  # Allow DNS resolution
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
