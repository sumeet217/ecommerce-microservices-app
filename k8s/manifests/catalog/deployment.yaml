apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: ecommerce
  labels:
    app: catalog-service
spec:
  # replicas intentionally omitted — managed by HPA (minReplicas: 2, maxReplicas: 10)
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: catalog-service
        image: sumeet02/django-retail-catalog:latest
        # TODO: Pin to an immutable tag (e.g. :1.2.3 or a git SHA) before production
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: catalog-secrets
              key: django-secret-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: catalog-secrets
              key: database-url
        - name: DJANGO_DEBUG
          valueFrom:
            configMapKeyRef:
              name: catalog-config
              key: django-debug
        - name: DJANGO_ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: catalog-config
              key: django-allowed-hosts
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: catalog-config
              key: port
        - name: GUNICORN_WORKERS
          valueFrom:
            configMapKeyRef:
              name: catalog-config
              key: gunicorn-workers
        - name: GUNICORN_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: catalog-config
              key: gunicorn-timeout
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: catalog-config
              key: log-level
        livenessProbe:
          httpGet:
            path: /health/
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
