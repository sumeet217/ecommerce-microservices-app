# =============================================================================
#  RetailStore — Nginx Reverse Proxy
#
#  This is the PUBLIC-FACING nginx (the standalone container on port 80).
#  It is separate from the nginx that lives INSIDE the UI Service container.
#
#  Routing table
#  -------------
#  /api/v1/catalog/   -->  catalog-service:8001
#  /api/v1/cart/      -->  cart-service:8002
#  /api/v1/orders/    -->  orders-service:8003
#  /api/schema/       -->  routed per path prefix above (handled by each service)
#  /api/docs/         -->  routed per path prefix above
#  /health            -->  nginx-level health check (returns 200 immediately)
#  /                  -->  ui-service:80
# =============================================================================

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging format ────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin"   always;

    # =========================================================================
    # Upstream definitions — names match Docker Compose service names
    # =========================================================================
    upstream catalog_backend {
        server catalog-service:8001;
        keepalive 16;
    }

    upstream cart_backend {
        server cart-service:8002;
        keepalive 16;
    }

    upstream orders_backend {
        server orders-service:8003;
        keepalive 16;
    }

    upstream ui_backend {
        server ui-service:80;
        keepalive 32;
    }

    # =========================================================================
    # Server block — port 80
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # -- Nginx-level health check (no upstream needed) --------------------
        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
            access_log off;
        }

        # -- Catalog Service API ----------------------------------------------
        location /api/v1/catalog/ {
            proxy_pass         http://catalog_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Catalog OpenAPI docs
        location /api/schema/catalog/ {
            proxy_pass         http://catalog_backend/api/schema/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Connection "";
        }

        location /api/docs/catalog/ {
            proxy_pass         http://catalog_backend/api/docs/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Connection "";
        }

        # -- Cart Service API -------------------------------------------------
        location /api/v1/cart/ {
            proxy_pass         http://cart_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            # Forward the session key header used by the Cart Service
            proxy_set_header   X-Session-Key     $http_x_session_key;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Cart OpenAPI docs
        location /api/schema/cart/ {
            proxy_pass         http://cart_backend/api/schema/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Connection "";
        }

        location /api/docs/cart/ {
            proxy_pass         http://cart_backend/api/docs/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Connection "";
        }

        # -- Orders Service API -----------------------------------------------
        location /api/v1/orders/ {
            proxy_pass         http://orders_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            # Forward the user identity header used by the Orders Service
            proxy_set_header   X-User-Id         $http_x_user_id;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Orders OpenAPI docs
        location /api/schema/orders/ {
            proxy_pass         http://orders_backend/api/schema/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Connection "";
        }

        location /api/docs/orders/ {
            proxy_pass         http://orders_backend/api/docs/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Connection "";
        }

        # -- UI Service (catch-all) -------------------------------------------
        location / {
            proxy_pass         http://ui_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
            # Pass Django session cookies through
            proxy_cookie_path / /;
        }

        # -- Error pages ------------------------------------------------------
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
