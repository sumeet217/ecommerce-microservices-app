# SonarQube Project Configuration
# Required for detailed code quality analysis

# Project identification
sonar.projectKey=retail-store-microservices
sonar.projectName=Retail Store Microservices
sonar.projectVersion=1.0

# Source code location
sonar.sources=services
sonar.sourceEncoding=UTF-8

# Python specific settings
sonar.language=py
sonar.python.version=3.11

# Exclusions
sonar.exclusions=**/migrations/**,\
                 **/tests/**,\
                 **/__pycache__/**,\
                 **/venv/**,\
                 **/env/**,\
                 **/*.pyc,\
                 **/node_modules/**,\
                 **/staticfiles/**,\
                 **/media/**

# Test exclusions
sonar.test.exclusions=**/tests/**,\
                      **/test_*.py,\
                      **/*_test.py

# Coverage settings
sonar.python.coverage.reportPaths=services/auth/coverage-auth.xml,\
                                  services/catalog/coverage-catalog.xml,\
                                  services/cart/coverage-cart.xml,\
                                  services/orders/coverage-orders.xml,\
                                  services/ui/coverage-ui.xml

# Code duplication detection
sonar.cpd.python.minimumTokens=50

# Quality gate conditions (adjust as needed)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
