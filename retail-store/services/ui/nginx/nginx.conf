# ─── Nginx configuration for the UI Service ───────────────────────────────────
# Serves static files directly, proxies everything else to Django/Gunicorn.

upstream django_ui {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml font/woff2;

    # ── Static files served directly by Nginx ────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health check (Nginx level, no Django needed) ─────────────────────────
    location /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }

    # ── All other requests → Django/Gunicorn ─────────────────────────────────
    location / {
        proxy_pass         http://django_ui;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # Pass through Django's session cookie
        proxy_cookie_path / /;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
