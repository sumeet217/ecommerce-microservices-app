---
# GitLab CI/CD Pipeline for Django Microservices E-Commerce
# Following DevSecOps Best Practices

variables:
  # Python Configuration
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  
  # SonarQube Configuration
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  SONAR_HOST_URL: "${SONAR_HOST_URL}"
  SONAR_TOKEN: "${SONAR_TOKEN}"
  
  # AWS Configuration
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
  EC2_HOST: "${EC2_HOST}"
  EC2_USER: "${EC2_USER}"
  
  # Security Scanning
  TRIVY_CACHE_DIR: ".trivycache/"
  
  # Service Names
  SERVICES: "auth catalog cart orders ui"

  # Docker Hub — set DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN as CI/CD variables
  DOCKER_REGISTRY: "docker.io"
  DOCKER_HUB_NAMESPACE: "sumeet02"

  # Image tag: use the git tag if available, otherwise short SHA
  IMAGE_TAG: "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"

  # Deployment directory on the EC2 server
  DEPLOY_DIR: "/opt/retail-store"

# Define pipeline stages
stages:
  - clone
  - test
  - security-scan
  - quality-gate
  - build
  - deploy

# Cache configuration for faster builds
cache:
  paths:
    - .cache/pip
    - .sonar/cache
    - .trivycache/

# ============================================
# STAGE 1: CLONE & SETUP
# ============================================

clone_repository:
  stage: clone
  image: alpine/git:latest
  script:
    - echo "Repository cloned successfully"
    - echo "Project path: $CI_PROJECT_DIR"
    - echo "Branch: $CI_COMMIT_REF_NAME"
    - echo "Commit: $CI_COMMIT_SHORT_SHA"
    - ls -la
  artifacts:
    paths:
      - ./*
    expire_in: 1 hour
  tags:
    - docker

# ============================================
# STAGE 2: TEST & CODE QUALITY
# ============================================

unit_tests:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev
    - pip install --upgrade pip
  script:
    - echo "Running unit tests for all services..."
    - |
      for service in $SERVICES; do
        echo "Testing service: $service"
        cd services/$service
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-django
        
        # Run tests with coverage
        pytest --cov=. --cov-report=xml:coverage-$service.xml --cov-report=term --junit-xml=junit-$service.xml || true
        
        cd $CI_PROJECT_DIR
      done
  artifacts:
    reports:
      junit:
        - services/*/junit-*.xml
      coverage_report:
        coverage_format: cobertura
        path: services/*/coverage-*.xml
    paths:
      - services/*/coverage-*.xml
      - services/*/junit-*.xml
    expire_in: 1 week
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  tags:
    - docker

lint_code:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install --upgrade pip
    - pip install flake8 pylint black isort bandit
  script:
    - echo "Running linting checks..."
    - |
      for service in $SERVICES; do
        echo "Linting service: $service"
        cd services/$service
        
        # Check code formatting
        echo "Checking code formatting with black..."
        black --check --diff . || true
        
        # Check import sorting
        echo "Checking import sorting with isort..."
        isort --check-only --diff . || true
        
        # Run flake8
        echo "Running flake8..."
        flake8 . --max-line-length=120 --exclude=migrations,venv,__pycache__ --statistics || true
        
        cd $CI_PROJECT_DIR
      done
  allow_failure: true
  tags:
    - docker

# ============================================
# STAGE 3: SECURITY SCANNING
# ============================================

sonarqube_analysis:
  stage: security-scan
  image: sonarsource/sonar-scanner-cli:latest
  dependencies:
    - unit_tests
  script:
    - echo "Running SonarQube analysis..."
    - |
      sonar-scanner \
        -Dsonar.projectKey=${CI_PROJECT_NAME} \
        -Dsonar.projectName=${CI_PROJECT_NAME} \
        -Dsonar.projectVersion=${CI_COMMIT_SHORT_SHA} \
        -Dsonar.sources=services \
        -Dsonar.exclusions=**/migrations/**,**/tests/**,**/__pycache__/**,**/venv/** \
        -Dsonar.python.coverage.reportPaths=services/*/coverage-*.xml \
        -Dsonar.python.version=${PYTHON_VERSION} \
        -Dsonar.host.url=${SONAR_HOST_URL} \
        -Dsonar.login=${SONAR_TOKEN}
  allow_failure: false
  only:
    - main
    - develop
    - merge_requests
  tags:
    - docker

owasp_dependency_check:
  stage: security-scan
  image: owasp/dependency-check:latest
  script:
    - echo "Running OWASP Dependency Check..."
    - |
      for service in $SERVICES; do
        echo "Scanning dependencies for service: $service"
        /usr/share/dependency-check/bin/dependency-check.sh \
          --scan services/$service \
          --format ALL \
          --project "$service-service" \
          --out dependency-check-reports/$service \
          --suppression suppression.xml \
          --enableExperimental \
          || true
      done
  artifacts:
    paths:
      - dependency-check-reports/
    reports:
      dependency_scanning: dependency-check-reports/*/dependency-check-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  tags:
    - docker

bandit_security_scan:
  stage: security-scan
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install bandit[toml]
  script:
    - echo "Running Bandit security scan..."
    - |
      for service in $SERVICES; do
        echo "Scanning service: $service"
        bandit -r services/$service -f json -o bandit-report-$service.json -ll || true
        bandit -r services/$service -f txt -o bandit-report-$service.txt -ll || true
      done
  artifacts:
    paths:
      - bandit-report-*.json
      - bandit-report-*.txt
    expire_in: 1 week
  allow_failure: true
  tags:
    - docker

trivy_filesystem_scan:
  stage: security-scan
  image: aquasec/trivy:latest
  before_script:
    - mkdir -p $TRIVY_CACHE_DIR
  script:
    - echo "Running Trivy filesystem scan..."
    - |
      for service in $SERVICES; do
        echo "Scanning service: $service"
        trivy fs \
          --severity CRITICAL,HIGH,MEDIUM \
          --format json \
          --output trivy-fs-report-$service.json \
          services/$service || true
        
        trivy fs \
          --severity CRITICAL,HIGH,MEDIUM \
          --format table \
          --output trivy-fs-report-$service.txt \
          services/$service || true
      done
    - echo "Filesystem scan completed"
  artifacts:
    paths:
      - trivy-fs-report-*.json
      - trivy-fs-report-*.txt
    expire_in: 1 week
    when: always
  tags:
    - docker

# ============================================
# STAGE 4: QUALITY GATE
# ============================================

sonarqube_quality_gate:
  stage: quality-gate
  image: curlimages/curl:latest
  script:
    - echo "Checking SonarQube Quality Gate status..."
    - |
      # Wait for SonarQube to process the analysis
      sleep 10
      
      # Get the quality gate status
      QUALITY_GATE_STATUS=$(curl -s -u ${SONAR_TOKEN}: \
        "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${CI_PROJECT_NAME}" \
        | grep -oP '"status":"\K\w+' || echo "NONE")
      
      echo "Quality Gate Status: $QUALITY_GATE_STATUS"
      
      if [ "$QUALITY_GATE_STATUS" = "ERROR" ]; then
        echo "Quality Gate FAILED! Please fix the issues in SonarQube."
        exit 1
      elif [ "$QUALITY_GATE_STATUS" = "OK" ]; then
        echo "Quality Gate PASSED!"
        exit 0
      else
        echo "Quality Gate status unknown or not available yet."
        exit 0
      fi
  dependencies:
    - sonarqube_analysis
  allow_failure: false
  only:
    - main
    - develop
  tags:
    - docker

security_gate:
  stage: quality-gate
  image: python:${PYTHON_VERSION}-slim
  script:
    - echo "Evaluating security scan results..."
    - pip install jq || apt-get update && apt-get install -y jq
    - |
      CRITICAL_FOUND=0
      
      # Check Trivy results for critical vulnerabilities
      for report in trivy-fs-report-*.json; do
        if [ -f "$report" ]; then
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$report" 2>/dev/null || echo 0)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "CRITICAL vulnerabilities found in $report: $CRITICAL"
            CRITICAL_FOUND=1
          fi
        fi
      done
      
      if [ $CRITICAL_FOUND -eq 1 ]; then
        echo "Security gate FAILED: Critical vulnerabilities detected!"
        echo "Please review the Trivy reports and fix critical issues."
        exit 1
      else
        echo "Security gate PASSED: No critical vulnerabilities found."
      fi
  dependencies:
    - trivy_filesystem_scan
  allow_failure: true
  tags:
    - docker

# ============================================
# STAGE 5: BUILD & PUSH DOCKER IMAGES
# ============================================
# Images are built ONCE in CI, pushed to Docker Hub, then PULLED on the server.
# The production server never compiles code or installs pip packages.

build_and_push_images:
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    # Authenticate with Docker Hub using CI/CD secret variables
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
  script:
    - echo "Building and pushing Docker images — tag: ${IMAGE_TAG}"
    - |
      # Map service folder names to their Docker Hub image names
      declare -A IMAGE_NAMES
      IMAGE_NAMES[auth]="django-auth-service"
      IMAGE_NAMES[catalog]="django-retail-catalog"
      IMAGE_NAMES[cart]="django-retail-cart"
      IMAGE_NAMES[orders]="django-retail-orders"
      IMAGE_NAMES[ui]="django-retail-ui"

      for service in $SERVICES; do
        IMAGE="${DOCKER_HUB_NAMESPACE}/${IMAGE_NAMES[$service]}"
        echo "------ Building ${IMAGE}:${IMAGE_TAG} ------"

        docker build \
          --pull \
          --cache-from "${IMAGE}:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "${IMAGE}:${IMAGE_TAG}" \
          -t "${IMAGE}:latest" \
          services/$service

        docker push "${IMAGE}:${IMAGE_TAG}"
        docker push "${IMAGE}:latest"

        echo "Pushed ${IMAGE}:${IMAGE_TAG}"
      done
  after_script:
    - docker logout
  only:
    - main
    - develop
  tags:
    - docker

# ============================================
# STAGE 5b: TRIVY IMAGE SCAN (post-build)
# ============================================
# Scan the freshly pushed images for vulnerabilities before deploying.

trivy_image_scan:
  stage: build
  image: aquasec/trivy:latest
  needs:
    - build_and_push_images
  before_script:
    - mkdir -p $TRIVY_CACHE_DIR
  script:
    - echo "Scanning Docker images for HIGH/CRITICAL CVEs..."
    - |
      declare -A IMAGE_NAMES
      IMAGE_NAMES[auth]="django-auth-service"
      IMAGE_NAMES[catalog]="django-retail-catalog"
      IMAGE_NAMES[cart]="django-retail-cart"
      IMAGE_NAMES[orders]="django-retail-orders"
      IMAGE_NAMES[ui]="django-retail-ui"

      for service in $SERVICES; do
        IMAGE="${DOCKER_HUB_NAMESPACE}/${IMAGE_NAMES[$service]}:${IMAGE_TAG}"
        echo "Scanning image: $IMAGE"

        trivy image \
          --severity HIGH,CRITICAL \
          --format json \
          --output trivy-image-report-$service.json \
          --cache-dir $TRIVY_CACHE_DIR \
          "$IMAGE" || true

        trivy image \
          --severity HIGH,CRITICAL \
          --format table \
          --cache-dir $TRIVY_CACHE_DIR \
          "$IMAGE" || true
      done
  artifacts:
    paths:
      - trivy-image-report-*.json
    expire_in: 1 week
    when: always
  only:
    - main
    - develop
  tags:
    - docker

# ============================================
# STAGE 6: DEPLOY TO AWS EC2  (pull images)
# ============================================
# The EC2 server ONLY pulls pre-built images and runs docker compose up.
# No source code, no pip install, no build tools needed on the server.

deploy_to_ec2:
  stage: deploy
  image: alpine:latest
  needs:
    - build_and_push_images
    - trivy_image_scan
  before_script:
    - apk add --no-cache openssh-client bash curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying tag [${IMAGE_TAG}] to EC2: ${EC2_HOST}"

    # ── 1. Push docker-compose files to the server ──────────────────────────
    - |
      scp -o StrictHostKeyChecking=no \
        docker-compose.yml \
        docker-compose.prod.yml \
        .env \
        ${EC2_USER}@${EC2_HOST}:${DEPLOY_DIR}/

    # ── 2. Pull images and restart containers ───────────────────────────────
    - |
      ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} bash -s << ENDSSH
        set -e
        cd ${DEPLOY_DIR}

        echo "=== Logging in to Docker Hub ==="
        echo "\$DOCKER_HUB_TOKEN" | docker login -u "${DOCKER_HUB_USERNAME}" --password-stdin

        echo "=== Pulling images for tag: ${IMAGE_TAG} ==="
        IMAGE_TAG=${IMAGE_TAG} \
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

        echo "=== Saving current container IDs for rollback ==="
        docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q > /tmp/previous_containers.txt || true

        echo "=== Performing zero-downtime restart ==="
        IMAGE_TAG=${IMAGE_TAG} \
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

        echo "=== Waiting 30s for health checks ==="
        sleep 30

        echo "=== Container health status ==="
        docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

        echo "=== Application health check ==="
        curl -f http://localhost/health || { echo "Health check FAILED!"; exit 1; }

        echo "=== Removing dangling images ==="
        docker image prune -f

        docker logout
        echo "Deployment completed successfully — tag: ${IMAGE_TAG}"
      ENDSSH

    - echo "Deployment to EC2 completed!"
  environment:
    name: production
    url: http://$EC2_HOST
  only:
    - main
  when: manual
  tags:
    - docker

# ============================================
# ROLLBACK JOB  (pull previous image tag)
# ============================================
# Set the ROLLBACK_TAG CI/CD variable to the image tag you want to roll back to
# (e.g. v1.1.0 or the previous short SHA), then trigger this job manually.

rollback_deployment:
  stage: deploy
  image: alpine:latest
  variables:
    ROLLBACK_TAG: ""    # Override this in the GitLab "Run pipeline" dialog
  before_script:
    - apk add --no-cache openssh-client bash curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
  script:
    - |
      if [ -z "$ROLLBACK_TAG" ]; then
        echo "ERROR: Set the ROLLBACK_TAG variable to the image tag you want to restore."
        exit 1
      fi
    - echo "Rolling back to tag: ${ROLLBACK_TAG}"
    - |
      ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} bash -s << ENDSSH
        set -e
        cd ${DEPLOY_DIR}

        echo "\$DOCKER_HUB_TOKEN" | docker login -u "${DOCKER_HUB_USERNAME}" --password-stdin

        echo "=== Pulling rollback images — tag: ${ROLLBACK_TAG} ==="
        IMAGE_TAG=${ROLLBACK_TAG} \
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

        echo "=== Restarting with rollback images ==="
        IMAGE_TAG=${ROLLBACK_TAG} \
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

        sleep 20
        curl -f http://localhost/health || { echo "Rollback health check FAILED!"; exit 1; }

        docker logout
        echo "Rollback to ${ROLLBACK_TAG} completed!"
      ENDSSH
  only:
    - main
  when: manual
  tags:
    - docker
